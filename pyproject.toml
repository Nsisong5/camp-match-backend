[tool.poetry]
name = "camp-match"
version = "0.1.0"
description = "Camp Match backend — modular monolith, hexagonal architecture"
authors = ["SoTrick Engineering"]
readme = "README.md"
packages = [{include = "camp_match", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
pydantic = "*"
pydantic-settings = "*"
structlog = "*"
sqlalchemy = "^2.0.52"
asyncpg = "^0.31.0"
pyjwt = "^2.13.0"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
httpx = "*"
ruff = "*"
mypy = "*"
import-linter = "*"
alembic = "^1.19.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure logic, no I/O",
    "integration: real adapters (db, external systems)",
    "api: HTTP-level tests against the FastAPI app",
    "architecture: import/dependency boundary checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_package = "camp_match"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.shared_kernel.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "camp_match.platform.db", "camp_match.config"]

[[tool.importlinter.contracts]]
name = "Identity Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.modules.identity.domain"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Identity Application must not import frameworks"
type = "forbidden"
source_modules = ["camp_match.modules.identity.application"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Identity Adapters are private"
type = "forbidden"
source_modules = ["camp_match.modules"]
excluded_modules = ["camp_match.modules.identity.adapters"]
forbidden_modules = ["camp_match.modules.identity.adapters"]

[[tool.importlinter.contracts]]
name = "Security Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.modules.security.domain"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Security Application must not import frameworks"
type = "forbidden"
source_modules = ["camp_match.modules.security.application"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Security Adapters are private"
type = "forbidden"
source_modules = ["camp_match.modules"]
excluded_modules = ["camp_match.modules.security"]
forbidden_modules = [
    "camp_match.modules.security.adapters.persistence",
    "camp_match.modules.security.adapters.profile"
]

[[tool.importlinter.contracts]]
name = "Security Profile Adapter boundary"
type = "forbidden"
source_modules = ["camp_match.modules.security.adapters.profile"]
forbidden_modules = [
    "camp_match.modules.profile.adapters",
    "camp_match.modules.profile.domain"
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "University Location Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.modules.university_location.domain"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "University Location Application must not import frameworks"
type = "forbidden"
source_modules = ["camp_match.modules.university_location.application"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "University Location Adapters are private"
type = "forbidden"
source_modules = ["camp_match.modules"]
excluded_modules = ["camp_match.modules.university_location"]
forbidden_modules = [
    "camp_match.modules.university_location.adapters.persistence"
]

[[tool.importlinter.contracts]]
name = "Search Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.modules.search.domain"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Search Application must not import frameworks"
type = "forbidden"
source_modules = ["camp_match.modules.search.application"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Search Adapters are private"
type = "forbidden"
source_modules = ["camp_match.modules"]
excluded_modules = ["camp_match.modules.search"]
forbidden_modules = ["camp_match.modules.search.adapters"]

[[tool.importlinter.contracts]]
name = "Search adapters import restrictions"
type = "forbidden"
source_modules = ["camp_match.modules.search.adapters"]
forbidden_modules = [
    "camp_match.modules.housing.adapters",
    "camp_match.modules.university_location.adapters",
    "camp_match.modules.profile.adapters",
    "camp_match.modules.verification.adapters"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
