[tool.poetry]
name = "camp-match"
version = "0.1.0"
description = "Camp Match backend — modular monolith, hexagonal architecture"
authors = ["SoTrick Engineering"]
readme = "README.md"
packages = [{include = "camp_match", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
pydantic = "*"
pydantic-settings = "*"
structlog = "*"
sqlalchemy = "^2.0.52"
asyncpg = "^0.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
httpx = "*"
ruff = "*"
mypy = "*"
import-linter = "*"
alembic = "^1.19.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure logic, no I/O",
    "integration: real adapters (db, external systems)",
    "api: HTTP-level tests against the FastAPI app",
    "architecture: import/dependency boundary checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.importlinter]
root_package = "camp_match"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain must stay framework-free"
type = "forbidden"
source_modules = ["camp_match.shared_kernel.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "camp_match.platform", "camp_match.config"]

[[tool.importlinter.contracts]]
name = "Application must not import platform infrastructure directly"
type = "forbidden"
source_modules = ["camp_match.shared_kernel.application"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
