[tool.poetry]
name = "camp-match"
version = "0.1.0"
description = "Camp Match backend — modular monolith, hexagonal architecture"
authors = ["SoTrick Engineering"]
readme = "README.md"
packages = [{include = "camp_match", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
pydantic = "*"
pydantic-settings = "*"
structlog = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
httpx = "*"
ruff = "*"
mypy = "*"
import-linter = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure logic, no I/O",
    "integration: real adapters (db, external systems)",
    "api: HTTP-level tests against the FastAPI app",
    "architecture: import/dependency boundary checks",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
